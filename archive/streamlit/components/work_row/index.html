<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
</head>
<body>
  <div id="root"></div>
  <script>
    const root = document.getElementById("root");
    let lastFlushSeen = 0;

    function sendMessage(type, payload) {
      window.parent.postMessage({
        isStreamlitMessage: true,
        type,
        ...payload,
      }, "*");
    }

    function setFrameHeight(height) {
      sendMessage("streamlit:setFrameHeight", { height });
    }

    function setComponentValue(value) {
      sendMessage("streamlit:setComponentValue", {
        value,
        dataType: "json",
      });
    }

    function collectInlineValues() {
      const data = {};
      root.querySelectorAll("[data-inline-key]").forEach((el) => {
        data[el.getAttribute("data-inline-key")] = el.value;
      });
      return data;
    }

    function syncInlineValues() {
      setComponentValue(collectInlineValues());
    }

    window.addEventListener("message", (event) => {
      const data = event.data || {};
      if (data.type !== "streamlit:render") {
        return;
      }
      const args = data.args || {};
      root.innerHTML = args.html || "";
      setFrameHeight(args.height || document.body.scrollHeight);

      const flush = Number(args.flush || 0);
      if (flush > lastFlushSeen) {
        lastFlushSeen = flush;
        syncInlineValues();
      }
    });

    sendMessage("streamlit:componentReady", { apiVersion: 1 });
  </script>
</body>
</html>
