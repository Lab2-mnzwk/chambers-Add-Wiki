<!DOCTYPE html>
<html>
<head>
  <base target="_top" />
  <meta charset="utf-8" />
  <style>
    :root {
      color-scheme: dark;
      font-family: "Source Sans Pro", -apple-system, "Segoe UI", sans-serif;
      font-size: 14px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 12px;
      background: #0e1117;
      color: #f5f5f5;
    }
    body.webapp {
      padding: 12px 16px 24px;
    }
    h1 { font-size: 16px; margin: 0 0 4px; }
    body.webapp h1 { font-size: 20px; }
    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .sheet-link {
      color: #9ec5ff;
      text-decoration: none;
      font-size: 13px;
      white-space: nowrap;
    }
    .sheet-link:hover { text-decoration: underline; }
    .muted { color: rgba(245, 245, 245, 0.65); font-size: 12px; }

    .app-layout { display: block; }
    body.webapp .app-layout {
      display: grid;
      grid-template-columns: 272px minmax(0, 1fr);
      gap: 14px;
      align-items: start;
    }

    .settings-aside {
      background: #262730;
      border: 1px solid rgba(250, 250, 250, 0.12);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 10px;
    }
    body.webapp .settings-aside {
      margin-bottom: 0;
      position: sticky;
      top: 8px;
      max-height: calc(100vh - 24px);
      overflow-y: auto;
    }
    .settings-title {
      font-size: 13px;
      font-weight: 700;
      margin: 0 0 8px;
      color: rgba(245, 245, 245, 0.9);
    }
    body.sidebar .settings-collapsible > summary { display: none; }
    body.webapp .settings-title { display: none; }
    body.webapp .settings-collapsible > summary {
      cursor: pointer;
      font-weight: 700;
      margin-bottom: 8px;
      list-style: none;
    }
    body.webapp .settings-collapsible[open] > summary { margin-bottom: 10px; }

    label { display: block; margin: 8px 0 4px; font-size: 12px; }
    select, input[type="number"], input[type="text"] {
      width: 100%;
      background: #0e1117;
      color: #f5f5f5;
      border: 1px solid rgba(250, 250, 250, 0.2);
      border-radius: 6px;
      padding: 6px 8px;
    }
    .checks label {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 6px 0;
    }
    .checks input { width: auto; }
    .btn-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    button {
      border: none;
      border-radius: 6px;
      padding: 8px 10px;
      cursor: pointer;
      font-size: 13px;
    }
    button.primary { background: #ff4b4b; color: white; }
    button.secondary { background: #3d4450; color: #f5f5f5; }
    button:disabled { opacity: 0.5; cursor: default; }

    .work-main { min-width: 0; }
    .summary {
      font-weight: 700;
      font-size: 16px;
      margin: 0 0 6px;
      word-break: break-word;
    }
    body.webapp .summary { font-size: 18px; }
    .progress { font-size: 12px; margin-bottom: 8px; color: rgba(245,245,245,0.75); }

    .work-outer {
      overflow-x: auto;
      overflow-y: hidden;
      width: 100%;
      border: 1px solid rgba(250, 250, 250, 0.18);
      border-radius: 8px;
      padding: 4px 2px 8px;
      margin-bottom: 12px;
    }
    .work-track {
      display: flex;
      flex-wrap: nowrap;
      width: max-content;
      gap: 6px;
      padding: 4px 6px;
    }
    .work-col {
      border: 1px solid rgba(160, 165, 175, 0.5);
      border-radius: 6px;
      padding: 8px 10px;
      min-height: 120px;
      width: 128px;
      flex: 0 0 128px;
      background: #3d4450;
      display: flex;
      flex-direction: column;
    }
    .work-col.leading {
      width: 86px;
      flex-basis: 86px;
      padding: 8px 6px;
    }
    .work-col.wiki {
      background: #2f4563;
      border-color: rgba(125, 180, 255, 0.55);
    }
    .work-col.wiki .work-readonly {
      flex: 1 1 auto;
      min-height: 72px;
    }
    .work-col.edit {
      background: #4a4028;
      border: 2px solid #c99700;
      box-shadow: inset 0 0 0 1px rgba(255, 220, 100, 0.2);
    }
    .work-letter {
      font-size: 13px;
      font-weight: 700;
      color: rgba(250, 250, 250, 0.78);
      text-align: center;
    }
    .work-header {
      font-size: 14px;
      font-weight: 700;
      color: #f5f5f5;
      margin: 4px 0 8px;
      word-break: break-word;
    }
    .work-readonly {
      font-size: 16px;
      line-height: 1.45;
      color: #f5f5f5;
      word-break: break-word;
    }
    .work-readonly a {
      color: #9ec5ff;
      text-decoration: underline;
      word-break: break-all;
    }
    .work-input, .work-select, .work-textarea {
      width: 100%;
      background: #fff8dc;
      color: #1a1a1a;
      border: 2px solid #c99700;
      border-radius: 6px;
      font-size: 16px;
      padding: 6px 8px;
    }
    .work-textarea {
      flex: 1 1 auto;
      min-height: 72px;
      line-height: 1.45;
      font-family: inherit;
      resize: vertical;
    }
    .work-select { flex: 0 0 auto; }

    .nav-panel {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      align-items: end;
    }
    @media (max-width: 720px) {
      body.webapp .app-layout { grid-template-columns: 1fr; }
      body.webapp .settings-aside { position: static; max-height: none; }
      .nav-panel { grid-template-columns: 1fr; }
    }

    .status-bar { min-height: 18px; font-size: 12px; margin-top: 8px; }
    .status-bar.error { color: #ff8a8a; }
    .status-bar.ok { color: #7dffb2; }
    .toast {
      position: fixed;
      right: 16px;
      bottom: 16px;
      background: rgba(16, 20, 28, 0.96);
      border: 1px solid rgba(125, 180, 255, 0.45);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      z-index: 20;
      max-width: 320px;
    }
    .hidden { display: none; }
    .empty-panel {
      background: #262730;
      border: 1px solid rgba(250, 250, 250, 0.12);
      border-radius: 8px;
      padding: 12px;
    }
  </style>
</head>
<body class="<?= mode ?>">
  <div class="page-header">
    <div>
      <h1>Wiki付与 行作業</h1>
      <div id="meta" class="muted">読み込み中…</div>
    </div>
    <? if (mode === 'webapp') { ?>
    <a class="sheet-link" href="<?= sheetUrl ?>" target="_blank" rel="noopener">作業シートを開く ↗</a>
    <? } ?>
  </div>

  <div class="app-layout">
    <aside class="settings-aside">
      <details class="settings-collapsible" id="settingsDetails">
        <summary>作業設定</summary>
        <div class="settings-title">作業設定</div>
        <label for="worker">作業者名（Discord名）</label>
        <select id="worker"></select>

        <label for="queueFilter">対象行</label>
        <select id="queueFilter">
          <option value="未担当＋自分担当">未担当＋自分担当</option>
          <option value="未担当">未担当</option>
          <option value="自分担当">自分担当</option>
          <option value="すべて">すべて</option>
        </select>

        <div class="checks">
          <label><input type="checkbox" id="skipDone" checked /> 完了行をスキップ</label>
          <label><input type="checkbox" id="lightBlueOnly" checked /> AC列以降は水色列のみ</label>
          <label><input type="checkbox" id="showEmptyFromAc" /> AC列以降の空列も表示</label>
        </div>

        <label for="indexRows">インデックス行数</label>
        <input type="number" id="indexRows" min="100" max="10000" step="100" value="10000" />

        <div class="btn-row">
          <button class="secondary" id="reloadQueue">キュー再読込</button>
          <button class="secondary" id="clearCache">キャッシュクリア</button>
        </div>
      </details>
    </aside>

    <main class="work-main">
      <div id="workArea" class="hidden">
        <div class="summary" id="summary"></div>
        <div class="progress" id="progress"></div>
        <div class="work-outer"><div class="work-track" id="workTrack"></div></div>
        <div class="nav-panel">
          <div>
            <div class="btn-row">
              <button class="secondary" id="prevBtn">← 前の行</button>
              <button class="primary" id="saveNextBtn">次へ（保存）</button>
            </div>
          </div>
          <div>
            <label for="jumpRow">シート行番号</label>
            <div class="btn-row">
              <input type="number" id="jumpRow" min="2" step="1" />
              <button class="secondary" id="jumpBtn">開く</button>
            </div>
          </div>
        </div>
      </div>
      <div id="emptyQueue" class="empty-panel hidden">
        条件に一致する行がありません。フィルタを変更してください。
      </div>
    </main>
  </div>

  <div id="status" class="status-bar"></div>
  <div id="toast" class="toast hidden"></div>

  <script>
    const APP_MODE = '<?= mode ?>';
    const state = {
      bootstrap: null,
      queueRows: [],
      queueIndex: 0,
      history: [],
      historyIndex: -1,
      loading: false,
    };

    function $(id) { return document.getElementById(id); }

    function setStatus(text, kind) {
      const el = $('status');
      el.textContent = text || '';
      el.className = 'status-bar' + (kind ? ' ' + kind : '');
    }

    function showToast(text) {
      const el = $('toast');
      el.textContent = text;
      el.classList.remove('hidden');
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(function () {
        el.classList.add('hidden');
      }, 3500);
    }

    function getOptions() {
      return {
        worker: $('worker').value || '',
        queueFilter: $('queueFilter').value,
        skipDone: $('skipDone').checked,
        lightBlueOnly: $('lightBlueOnly').checked,
        showEmptyFromAc: $('showEmptyFromAc').checked,
        indexRows: Number($('indexRows').value) || 10000,
      };
    }

    function prefsKey() {
      return APP_MODE === 'webapp' ? 'wikiWorkWebApp' : 'wikiWorkSidebar';
    }

    function saveUiPrefs() {
      localStorage.setItem(prefsKey(), JSON.stringify(getOptions()));
    }

    function loadUiPrefs() {
      try {
        const raw = localStorage.getItem(prefsKey()) || localStorage.getItem('wikiWorkSidebar');
        if (!raw) return;
        const prefs = JSON.parse(raw);
        if (prefs.queueFilter) $('queueFilter').value = prefs.queueFilter;
        if (typeof prefs.skipDone === 'boolean') $('skipDone').checked = prefs.skipDone;
        if (typeof prefs.lightBlueOnly === 'boolean') $('lightBlueOnly').checked = prefs.lightBlueOnly;
        if (typeof prefs.showEmptyFromAc === 'boolean') $('showEmptyFromAc').checked = prefs.showEmptyFromAc;
        if (prefs.indexRows) $('indexRows').value = prefs.indexRows;
        if (prefs.worker) state.savedWorker = prefs.worker;
      } catch (e) {}
    }

    function renderWorkerSelect(names) {
      const sel = $('worker');
      sel.innerHTML = '';
      if (!names.length) {
        const opt = document.createElement('option');
        opt.value = '';
        opt.textContent = '（手入力: アサインシートを確認）';
        sel.appendChild(opt);
        return;
      }
      names.forEach(function (name) {
        const opt = document.createElement('option');
        opt.value = name;
        opt.textContent = name;
        sel.appendChild(opt);
      });
      if (state.savedWorker && names.indexOf(state.savedWorker) >= 0) {
        sel.value = state.savedWorker;
      }
    }

    function currentSheetRow() {
      if (state.historyIndex >= 0 && state.history[state.historyIndex]) {
        return state.history[state.historyIndex];
      }
      if (!state.queueRows.length) return null;
      return state.queueRows[state.queueIndex].sheetRowNumber;
    }

    function isRowInQueue(row) {
      return state.queueRows.some(function (item) {
        return item.sheetRowNumber === row;
      });
    }

    function syncQueueIndexFromHistory() {
      const row = currentSheetRow();
      if (!row) return;
      for (let i = 0; i < state.queueRows.length; i++) {
        if (state.queueRows[i].sheetRowNumber === row) {
          state.queueIndex = i;
          return;
        }
      }
    }

    function pushHistory(row) {
      if (state.historyIndex >= 0 && state.history[state.historyIndex] === row) return;
      state.history = state.history.slice(0, state.historyIndex + 1);
      state.history.push(row);
      state.historyIndex = state.history.length - 1;
    }

    function collectEdits() {
      const edits = {};
      document.querySelectorAll('[data-unique-name]').forEach(function (el) {
        edits[el.getAttribute('data-unique-name')] = el.value;
      });
      return edits;
    }

    function renderColumns(payload) {
      $('summary').textContent = payload.summary;
      $('progress').textContent =
        'キュー ' + (state.queueIndex + 1) + ' / ' + state.queueRows.length +
        ' · シート行 ' + payload.sheetRowNumber;
      $('jumpRow').value = payload.sheetRowNumber;

      const track = $('workTrack');
      track.innerHTML = '';

      payload.columns.forEach(function (col) {
        const div = document.createElement('div');
        const classes = ['work-col'];
        if (col.isLeading) classes.push('leading');
        if (col.isWiki && !col.inline) classes.push('wiki');
        if (col.inline) classes.push('edit');
        div.className = classes.join(' ');

        let body = '';
        if (col.inline) {
          if (col.isStatus) {
            const opts = (state.bootstrap.statusOptions || []).map(function (opt) {
              const selected = opt === col.value ? ' selected' : '';
              return '<option value="' + escapeAttr(opt) + '"' + selected + '>' +
                escapeHtml(opt) + '</option>';
            }).join('');
            body = '<select class="work-select" data-unique-name="' +
              escapeAttr(col.uniqueName) + '">' + opts + '</select>';
          } else if (col.isMemo || col.isWikiEdit) {
            body = '<textarea class="work-textarea work-input" data-unique-name="' +
              escapeAttr(col.uniqueName) + '">' + escapeHtml(col.value) + '</textarea>';
          } else {
            body = '<input class="work-input" data-unique-name="' +
              escapeAttr(col.uniqueName) + '" value="' + escapeAttr(col.value) + '" />';
          }
        } else {
          let display = col.display;
          if (display.startsWith('http://') || display.startsWith('https://')) {
            display = '<a href="' + escapeAttr(display) + '" target="_blank" rel="noopener">' +
              escapeHtml(display) + '</a>';
          } else {
            display = escapeHtml(display);
          }
          body = '<div class="work-readonly">' + display + '</div>';
        }

        div.innerHTML =
          '<div class="work-letter">' + escapeHtml(col.letter) + '</div>' +
          '<div class="work-header">' + escapeHtml(col.rawHeader) + '</div>' +
          body;
        track.appendChild(div);
      });
    }

    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function escapeAttr(text) {
      return escapeHtml(text).replace(/'/g, '&#39;');
    }

    function loadCurrentRow() {
      const row = currentSheetRow();
      if (!row) return;
      setStatus('行を読み込み中…');
      google.script.run
        .withSuccessHandler(function (payload) {
          renderColumns(payload);
          setStatus('');
          $('workArea').classList.remove('hidden');
          $('emptyQueue').classList.add('hidden');
        })
        .withFailureHandler(showError)
        .getWorkRowPayload(row, getOptions());
    }

    function reloadQueue(keepPosition) {
      saveUiPrefs();
      setStatus('キューを読み込み中…');
      google.script.run
        .withSuccessHandler(function (rows) {
          state.queueRows = rows || [];
          if (!state.queueRows.length) {
            $('workArea').classList.add('hidden');
            $('emptyQueue').classList.remove('hidden');
            setStatus('');
            return;
          }
          if (!keepPosition || state.historyIndex < 0) {
            state.history = [state.queueRows[0].sheetRowNumber];
            state.historyIndex = 0;
            state.queueIndex = 0;
          } else {
            syncQueueIndexFromHistory();
          }
          loadCurrentRow();
        })
        .withFailureHandler(showError)
        .getQueueRows(getOptions());
    }

    function showError(err) {
      setStatus(err && err.message ? err.message : String(err), 'error');
      state.loading = false;
      $('saveNextBtn').disabled = false;
    }

    function goPrev() {
      if (state.historyIndex <= 0) return;
      state.historyIndex -= 1;
      syncQueueIndexFromHistory();
      loadCurrentRow();
    }

    function goJump() {
      const target = Number($('jumpRow').value);
      if (!target || target < 2) {
        setStatus('行番号は 2 以上を指定してください。', 'error');
        return;
      }
      pushHistory(target);
      syncQueueIndexFromHistory();
      if (!isRowInQueue(target)) {
        showToast('現在のキュー外の行です（表示のみ）');
      }
      loadCurrentRow();
    }

    function saveAndNext() {
      if (state.loading) return;
      const row = currentSheetRow();
      if (!row) return;
      state.loading = true;
      $('saveNextBtn').disabled = true;
      setStatus('保存中…');

      google.script.run
        .withSuccessHandler(function (result) {
          state.loading = false;
          $('saveNextBtn').disabled = false;
          if (result.nextSheetRowNumber) {
            setStatus(result.savedCells + ' セルを保存しました。', 'ok');
            pushHistory(result.nextSheetRowNumber);
            syncQueueIndexFromHistory();
            loadCurrentRow();
          } else {
            setStatus('保存しました（キューの末尾です）。', 'ok');
          }
        })
        .withFailureHandler(showError)
        .saveWorkRowAndAdvance({
          sheetRowNumber: row,
          worker: $('worker').value || '',
          edits: collectEdits(),
          queueRows: state.queueRows,
          options: getOptions(),
        });
    }

    function initSettingsLayout() {
      const details = $('settingsDetails');
      if (APP_MODE === 'webapp') {
        details.open = true;
      } else {
        details.open = true;
      }
    }

    function init() {
      loadUiPrefs();
      initSettingsLayout();

      google.script.run
        .withSuccessHandler(function (bootstrap) {
          state.bootstrap = bootstrap;
          $('meta').textContent =
            bootstrap.spreadsheetTitle + ' / ' + bootstrap.sheetName +
            (bootstrap.enableWrites ? '' : '（書き込み OFF）');
          renderWorkerSelect(bootstrap.discordNames || []);
          $('indexRows').value = bootstrap.defaultIndexRows || 10000;
          reloadQueue(false);
        })
        .withFailureHandler(showError)
        .getSidebarBootstrap();

      $('reloadQueue').addEventListener('click', function () {
        reloadQueue(true);
      });
      $('clearCache').addEventListener('click', function () {
        google.script.run
          .withSuccessHandler(function () {
            setStatus('キャッシュをクリアしました。', 'ok');
            reloadQueue(true);
          })
          .withFailureHandler(showError)
          .invalidateStructureCache();
      });
      $('prevBtn').addEventListener('click', goPrev);
      $('saveNextBtn').addEventListener('click', saveAndNext);
      $('jumpBtn').addEventListener('click', goJump);

      ['worker', 'queueFilter', 'skipDone', 'lightBlueOnly', 'showEmptyFromAc', 'indexRows']
        .forEach(function (id) {
          $(id).addEventListener('change', function () {
            saveUiPrefs();
            reloadQueue(true);
          });
        });
    }

    init();
  </script>
</body>
</html>
